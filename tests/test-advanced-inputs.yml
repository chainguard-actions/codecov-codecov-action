name: Test advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory and codecov yml
        run: |
          mkdir -p /tmp/myworkdir
          cat > /tmp/myworkdir/codecov.yml <<'EOF'
          coverage:
            status:
              project:
                default:
                  target: auto
          EOF
      - id: action
        uses: .
        with:
          dry_run: 'true'
          codecov_yml_path: '/tmp/myworkdir/codecov.yml'
          commit_parent: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          base_sha: 'cccccccccccccccccccccccccccccccccccccccc'
          force: 'false'
          working-directory: '/tmp/myworkdir'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
      - name: Assert action completed
        run: |
          echo "PASS: action completed with advanced inputs"
