name: Test advanced options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/workdir
      - id: action
        uses: .
        with:
          gcov_args: '--branch-probabilities'
          gcov_ignore: '/tmp/ignore'
          gcov_include: '/tmp/include'
          os: 'linux'
          swift_project: 'MySwiftProject'
          job_code: 'job-001'
          url: 'https://codecov.io'
          working-directory: '/tmp/workdir'
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with advanced option inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
