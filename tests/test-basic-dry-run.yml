name: Test basic dry run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a simple coverage file
        run: |
          mkdir -p coverage
          cat > coverage/coverage.xml << 'EOF'
          <?xml version="1.0" ?>
          <coverage version="7.0" timestamp="1700000000" lines-valid="10" lines-covered="8" line-rate="0.8" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages>
              <package name="." line-rate="0.8" branch-rate="0" complexity="0">
                <classes>
                  <class name="example.py" filename="example.py" line-rate="0.8" branch-rate="0" complexity="0">
                    <lines>
                      <line number="1" hits="1"/>
                      <line number="2" hits="1"/>
                    </lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          EOF
      - id: action
        uses: .
        with:
          dry_run: "true"
          file: coverage/coverage.xml
          flags: unittests
          name: test-upload
          verbose: "true"
          fail_ci_if_error: "false"
        continue-on-error: true
      - name: Assert action ran without unexpected failure
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # dry_run mode may still exit non-zero if codecov CLI has issues,
          # but we just verify the step ran (outcome is set)
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action outcome is empty"
            exit 1
          fi
          echo "PASS: action ran with outcome=${{ steps.action.outcome }}"
