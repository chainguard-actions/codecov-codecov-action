name: Test binary and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake codecov binary and config
        run: |
          # Create a fake codecov binary that simulates dry-run success
          mkdir -p /tmp/fake-codecov-bin
          cat > /tmp/fake-codecov-bin/codecov << 'EOF'
          #!/bin/bash
          echo "Fake codecov CLI invoked with args: $@"
          exit 0
          EOF
          chmod +x /tmp/fake-codecov-bin/codecov

          # Create a minimal codecov.yml config
          mkdir -p /tmp/codecov-config
          cat > /tmp/codecov-config/codecov.yml << 'EOF'
          coverage:
            status:
              project:
                default:
                  target: auto
          EOF

          # Create a working directory for the action
          mkdir -p /tmp/work-dir
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
          binary: '/tmp/fake-codecov-bin/codecov'
          codecov_yml_path: '/tmp/codecov-config/codecov.yml'
          os: 'linux'
          force: 'false'
          working-directory: '/tmp/work-dir'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with binary and config inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
