name: Test binary and miscellaneous inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake codecov binary and config
        run: |
          mkdir -p /tmp/codecov-bin
          # Create a minimal fake codecov CLI that exits 0
          cat > /tmp/codecov-bin/codecov << 'EOF'
          #!/bin/sh
          echo "Fake codecov CLI called with: $@"
          exit 0
          EOF
          chmod +x /tmp/codecov-bin/codecov
          # Create a fake codecov.yml
          mkdir -p /tmp/codecov-config
          cat > /tmp/codecov-config/codecov.yml << 'YMLEOF'
          codecov:
            notify:
              wait_for_ci: false
          YMLEOF
      - id: action
        uses: .
        with:
          binary: '/tmp/codecov-bin/codecov'
          codecov_yml_path: '/tmp/codecov-config/codecov.yml'
          commit_parent: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          base_sha: 'cccccccccccccccccccccccccccccccccccccccc'
          force: 'false'
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with binary and misc inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
