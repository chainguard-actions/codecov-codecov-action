name: Test binary input (pre-downloaded CLI)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake codecov binary
        run: |
          mkdir -p /tmp/codecov-bin
          cat > /tmp/codecov-bin/codecov << 'EOF'
          #!/bin/bash
          echo "Fake codecov CLI invoked with args: $@"
          exit 0
          EOF
          chmod +x /tmp/codecov-bin/codecov
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
          binary: '/tmp/codecov-bin/codecov'
      - name: Assert action ran with binary input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with binary input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
