name: Test commit and binary options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake codecov yml and binary
        run: |
          mkdir -p /tmp/codecov-config
          cat > /tmp/codecov-config/codecov.yml <<'EOF'
          coverage:
            status:
              project:
                default:
                  target: auto
          EOF
          # Create a fake binary that just exits 0
          cat > /tmp/fake-codecov <<'EOF'
          #!/bin/sh
          echo "fake codecov binary called with: $*"
          exit 0
          EOF
          chmod +x /tmp/fake-codecov
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
          binary: '/tmp/fake-codecov'
          codecov_yml_path: '/tmp/codecov-config/codecov.yml'
          commit_parent: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          base_sha: 'cccccccccccccccccccccccccccccccccccccccc'
          force: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with commit/binary options"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
