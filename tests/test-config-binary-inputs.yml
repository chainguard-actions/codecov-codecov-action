name: Test config, binary, and working-directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up working directory and codecov config
        run: |
          mkdir -p /tmp/workdir
          cat > /tmp/codecov.yml << 'EOF'
          codecov:
            notify:
              wait_for_ci: false
          coverage:
            status:
              project:
                default:
                  target: auto
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
          codecov_yml_path: '/tmp/codecov.yml'
          working-directory: '/tmp/workdir'
      - name: Assert action ran with config and working-directory inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config and working-directory inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
