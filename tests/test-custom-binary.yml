name: Test custom binary input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake codecov binary
        run: |
          mkdir -p /tmp/fake-codecov-bin
          cat > /tmp/fake-codecov-bin/codecov << 'EOF'
          #!/bin/bash
          # Fake codecov CLI for testing
          echo "Fake Codecov CLI invoked with args: $@"
          # Simulate successful dry run
          exit 0
          EOF
          chmod +x /tmp/fake-codecov-bin/codecov

      - id: action
        uses: .
        with:
          binary: /tmp/fake-codecov-bin/codecov
          dry_run: 'true'
          handle_no_reports_found: 'true'
          verbose: 'true'
        continue-on-error: true

      - name: Assert action ran with custom binary
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom binary"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
