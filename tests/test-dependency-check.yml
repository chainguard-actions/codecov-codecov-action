name: Test system dependency check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify required system dependencies are present
        run: |
          for cmd in bash git curl gpg; do
            if ! command -v "$cmd" > /dev/null 2>&1; then
              echo "FAIL: Required dependency '$cmd' is missing"
              exit 1
            fi
            echo "OK: $cmd found at $(command -v $cmd)"
          done
          echo "All required dependencies are present"

      - name: Create mock Codecov CLI binary
        run: |
          cat > /tmp/mock-codecov-deps << 'EOF'
          #!/usr/bin/env bash
          echo "Mock Codecov CLI called with args: $@"
          exit 0
          EOF
          chmod +x /tmp/mock-codecov-deps

      - id: action
        uses: .
        with:
          binary: /tmp/mock-codecov-deps
          skip_validation: 'false'
          disable_telem: 'true'
          fail_ci_if_error: 'false'
          handle_no_reports_found: 'true'
          disable_search: 'true'

      - name: Assert dependency check passed
        run: |
          echo "System dependency check passed successfully"
          echo "PASS"
