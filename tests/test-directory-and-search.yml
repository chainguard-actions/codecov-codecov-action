name: Test directory and search inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create coverage directory structure
        run: |
          mkdir -p /tmp/cov-search/subdir
          echo '<?xml version="1.0" ?><coverage></coverage>' > /tmp/cov-search/coverage.xml
      - id: action
        uses: .
        with:
          directory: /tmp/cov-search
          exclude: subdir
          env_vars: OS,PYTHON
          plugins: noop
          report_code: default
          report_type: coverage
          dry_run: "true"
          handle_no_reports_found: "true"
      - name: Assert action completed
        run: |
          echo "PASS: action completed with directory and search inputs"
