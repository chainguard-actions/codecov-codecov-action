name: Test disable options and OS override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          disable_file_fixes: true
          disable_safe_directory: true
          exclude: node_modules,vendor
          os: linux
          dry_run: true
          handle_no_reports_found: true
      - name: Assert action completed
        run: |
          echo "Action completed successfully with disable_file_fixes, disable_safe_directory, exclude, and os inputs"
          echo "PASS"
