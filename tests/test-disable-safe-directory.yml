name: Test disable safe directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Codecov action with disable_safe_directory
        id: action
        uses: .
        with:
          disable_safe_directory: 'true'
          dry_run: 'true'
          skip_validation: 'true'
          handle_no_reports_found: 'true'
          disable_telem: 'true'
      - name: Assert action completed successfully with safe directory disabled
        run: |
          echo "Action completed with disable_safe_directory=true"
          echo "PASS: disable_safe_directory option worked correctly"
