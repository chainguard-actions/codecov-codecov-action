name: Test dry run (no upload)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake coverage file
        run: |
          cat > /tmp/coverage.xml <<'EOF'
          <?xml version="1.0" ?>
          <coverage version="6.0" timestamp="1234567890" lines-valid="10" lines-covered="8" line-rate="0.8" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages>
              <package name="." line-rate="0.8" branch-rate="0" complexity="0">
                <classes>
                  <class name="example.py" filename="example.py" line-rate="0.8" branch-rate="0" complexity="0">
                    <lines>
                      <line number="1" hits="1"/>
                    </lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          EOF

      - id: action
        uses: .
        with:
          dry_run: "true"
          file: /tmp/coverage.xml
          verbose: "true"
        continue-on-error: true

      - name: Assert action completed (dry run should not fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed in dry_run mode"
            exit 1
          fi
          echo "PASS: action completed in dry_run mode"
