name: Test enterprise and misc inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory and codecov yml
        run: |
          mkdir -p /tmp/myworkdir
          cat > /tmp/myworkdir/codecov.yml << 'EOF'
          coverage:
            precision: 2
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
          url: 'https://codecov.io'
          os: 'linux'
          swift_project: 'MySwiftProject'
          job_code: 'job-001'
          codecov_yml_path: '/tmp/myworkdir/codecov.yml'
          working-directory: '/tmp/myworkdir'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with enterprise and misc inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
