name: Test enterprise and service override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          git_service: github
          slug: myorg/myrepo
          url: https://codecov.io
          use_legacy_upload_endpoint: false
          dry_run: true
          handle_no_reports_found: true
      - name: Assert action completed
        run: |
          echo "Action completed successfully with enterprise/service override inputs"
          echo "PASS"
