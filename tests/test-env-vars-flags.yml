name: Test env vars and flags inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      PYTHON: "3.11"
      OS: "linux"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create coverage file
        run: |
          mkdir -p coverage
          cat > coverage/coverage.xml << 'EOF'
          <?xml version="1.0" ?>
          <coverage version="7.0" timestamp="1700000000" lines-valid="10" lines-covered="9" line-rate="0.9" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages>
              <package name="." line-rate="0.9" branch-rate="0" complexity="0">
                <classes>
                  <class name="module.py" filename="module.py" line-rate="0.9" branch-rate="0" complexity="0">
                    <lines>
                      <line number="1" hits="1"/>
                      <line number="2" hits="1"/>
                    </lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          EOF
      - id: action
        uses: .
        with:
          dry_run: "true"
          file: coverage/coverage.xml
          env_vars: OS,PYTHON
          flags: "unittests,python"
          name: env-vars-test
          fail_ci_if_error: "false"
          verbose: "true"
        continue-on-error: true
      - name: Assert action ran with env vars and flags
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action outcome is empty"
            exit 1
          fi
          echo "PASS: action ran with env_vars and flags, outcome=${{ steps.action.outcome }}"
