name: Test force and binary inputs
on:
  workflow_dispatch:
jobs:
  test-force:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          run_command: 'empty-upload'
          force: 'true'
      - name: Assert action ran with force input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with force input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake codecov binary
        run: |
          mkdir -p /tmp/fake-codecov-bin
          cat > /tmp/fake-codecov-bin/codecov << 'EOF'
          #!/bin/bash
          echo "Fake codecov CLI invoked with args: $@"
          exit 0
          EOF
          chmod +x /tmp/fake-codecov-bin/codecov
      - id: action-binary
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          binary: '/tmp/fake-codecov-bin/codecov'
          skip_validation: 'true'
      - name: Assert action ran with binary input
        env:
          OUTCOME: ${{ steps.action-binary.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with binary input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
