name: Test gcov and plugins inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry_run: 'true'
          gcov_args: '--branch-probabilities'
          gcov_ignore: 'tests/'
          gcov_include: 'src/'
          plugins: 'noop'
          swift_project: 'MyProject'
          os: 'linux'
          job_code: 'job-001'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
      - name: Assert action completed
        run: |
          echo "PASS: action completed with gcov and plugins inputs"
