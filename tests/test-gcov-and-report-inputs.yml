name: Test gcov and report inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create coverage file
        run: |
          echo '{"coverage": 100}' > /tmp/coverage.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          gcov_args: '--branch-probabilities'
          gcov_ignore: 'tests/*'
          gcov_include: 'src/*'
          gcov_executable: 'gcov'
          plugins: 'noop'
          report_type: 'coverage'
          report_code: 'default'
          root_dir: /tmp
          network_filter: 'src/'
          network_prefix: 'prefix/'
          dry_run: 'true'
          handle_no_reports_found: 'true'
          token: 'fake-codecov-token'
      - name: Assert action ran (dry run with gcov inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
