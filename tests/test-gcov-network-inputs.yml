name: Test gcov and network inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gcov_args: '--preserve-paths'
          gcov_ignore: '/tmp/ignore'
          gcov_include: '/tmp/include'
          root_dir: '/tmp'
          network_filter: 'src/'
          network_prefix: 'project/'
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with gcov and network inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
