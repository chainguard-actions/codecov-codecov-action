name: Test gcov and misc options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/workdir
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          gcov_args: '--branch-probabilities'
          gcov_ignore: '/tmp/ignored'
          gcov_include: '/tmp/included'
          os: 'linux'
          url: 'https://codecov.io'
          swift_project: ''
          job_code: 'test-job'
          working-directory: '/tmp/workdir'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with gcov/misc options"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
