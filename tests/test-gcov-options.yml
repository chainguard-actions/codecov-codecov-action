name: Test gcov and network options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          disable_search: "true"
          gcov_args: "--branch-probabilities"
          gcov_ignore: "vendor/"
          gcov_include: "src/"
          os: "linux"
          root_dir: "."
          network_filter: "src/"
          network_prefix: "/home/runner/work/"
          plugins: "noop"
          exclude: "vendor,node_modules"
      - name: Assert action ran with gcov and network options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with gcov and network options inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
