name: Test handle no reports found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          dry_run: 'true'
          skip_validation: 'true'
          handle_no_reports_found: 'true'
          disable_search: 'false'
          verbose: 'true'
        continue-on-error: true

      - name: Assert action ran (no reports found should be handled gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with handle_no_reports_found=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without real token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
