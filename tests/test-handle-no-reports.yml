name: Test handle_no_reports_found flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty directory with no coverage files
        run: mkdir -p /tmp/no-coverage-dir
      - id: action
        uses: .
        with:
          dry_run: 'true'
          skip_validation: 'true'
          handle_no_reports_found: 'true'
          disable_search: 'false'
          directory: '/tmp/no-coverage-dir'
          disable_telem: 'true'
          fail_ci_if_error: 'false'
        continue-on-error: true
      - name: Assert action ran gracefully with no reports
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with handle_no_reports_found=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without a valid token/repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
