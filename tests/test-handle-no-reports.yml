name: Test handle no reports found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          disable_search: "true"
          verbose: "true"
        continue-on-error: true

      - name: Assert action did not fail when no reports found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed even with handle_no_reports_found=true"
            exit 1
          fi
          echo "PASS: action handled missing reports gracefully"
