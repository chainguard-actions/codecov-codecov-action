name: Test miscellaneous inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory and codecov yml
        run: |
          mkdir -p /tmp/workdir
          cat > /tmp/workdir/codecov.yml << 'EOF'
          coverage:
            status:
              project:
                default:
                  target: auto
          EOF
      - id: action
        uses: .
        with:
          slug: 'myorg/myrepo'
          url: 'https://codecov.io'
          os: 'linux'
          swift_project: 'MySwiftProject'
          job_code: 'job-001'
          force: 'false'
          working-directory: '/tmp/workdir'
          codecov_yml_path: '/tmp/workdir/codecov.yml'
          commit_parent: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with miscellaneous inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
