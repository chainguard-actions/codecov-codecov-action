name: Test miscellaneous inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake codecov.yml
        run: |
          echo 'coverage:' > /tmp/codecov.yml
          echo '  precision: 2' >> /tmp/codecov.yml
      - id: action
        uses: .
        continue-on-error: true
        with:
          base_sha: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          commit_parent: 'cccccccccccccccccccccccccccccccccccccccc'
          codecov_yml_path: /tmp/codecov.yml
          job_code: 'job-001'
          os: 'linux'
          swift_project: 'MySwiftProject'
          dry_run: 'true'
          handle_no_reports_found: 'true'
          token: 'fake-codecov-token'
      - name: Assert action ran (dry run with misc inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
