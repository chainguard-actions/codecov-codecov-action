name: Test miscellaneous inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up working directory and codecov yml
        run: |
          mkdir -p /tmp/workdir
          cat > /tmp/codecov.yml << 'EOF'
          codecov:
            require_ci_to_pass: no
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: "true"
          base_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          commit_parent: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          job_code: "test-job-001"
          os: "linux"
          swift_project: ""
          codecov_yml_path: "/tmp/codecov.yml"
          working-directory: "/tmp/workdir"
          handle_no_reports_found: "true"
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with miscellaneous inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
