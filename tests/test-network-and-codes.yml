name: Test network and code inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          job_code: test-job-001
          report_code: test-report-001
          network_filter: src/
          network_prefix: /home/runner/work/myrepo/
          dry_run: true
          handle_no_reports_found: true
      - name: Assert action completed
        run: |
          echo "Action completed successfully with job_code, report_code, network_filter, network_prefix inputs"
          echo "PASS"
