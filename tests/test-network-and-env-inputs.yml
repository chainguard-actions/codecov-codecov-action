name: Test network and env inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry_run: 'true'
          env_vars: 'OS,PYTHON'
          exclude: 'vendor,node_modules'
          network_filter: 'src/'
          network_prefix: 'prefix/'
          root_dir: '.'
          report_code: 'default'
          report_type: 'coverage'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
      - name: Assert action completed
        run: |
          echo "PASS: action completed with network and env inputs"
