name: Test network and misc inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/workdir
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          network_filter: 'src/'
          network_prefix: 'prefix/'
          url: 'https://codecov.io'
          os: 'linux'
          job_code: 'job-001'
          swift_project: 'MySwiftProject'
          working-directory: '/tmp/workdir'
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran with network and misc inputs"
          else
            echo "FAIL: unexpected outcome"
            exit 1
          fi
