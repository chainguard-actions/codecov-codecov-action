name: Test handle no reports found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          fail_ci_if_error: "false"
          disable_search: "false"
          verbose: "true"
        continue-on-error: true
      - name: Assert action did not fail due to missing reports
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With handle_no_reports_found=true, the action should succeed
          # even when no coverage files are present
          if [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "FAIL: action failed unexpectedly with handle_no_reports_found=true"
            exit 1
          fi
          echo "PASS: action handled missing reports gracefully"
