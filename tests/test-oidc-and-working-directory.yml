name: Test OIDC and working-directory options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with coverage file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myapp"
          cat > "$GITHUB_WORKSPACE/myapp/coverage.xml" <<'EOF'
          <?xml version="1.0" ?>
          <coverage version="5.5" timestamp="1234567890" lines-valid="10" lines-covered="8" line-rate="0.8" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
          </coverage>
          EOF
      - id: action
        uses: .
        with:
          use_oidc: false
          working-directory: myapp
          dry_run: true
          handle_no_reports_found: true
      - name: Assert action completed
        run: |
          echo "Action completed successfully with use_oidc and working-directory inputs"
          echo "PASS"
