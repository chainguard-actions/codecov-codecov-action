name: Test override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake coverage file
        run: |
          mkdir -p /tmp/coverage-dir
          echo '<?xml version="1.0" ?><coverage></coverage>' > /tmp/coverage-dir/coverage.xml
      - id: action
        uses: .
        with:
          token: fake-test-token
          slug: test-owner/test-repo
          override_branch: main
          override_build: "42"
          override_build_url: https://example.com/build/42
          override_commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          override_pr: "123"
          dry_run: "true"
          handle_no_reports_found: "true"
          files: /tmp/coverage-dir/coverage.xml
      - name: Assert action completed
        run: |
          echo "PASS: action completed with override inputs"
