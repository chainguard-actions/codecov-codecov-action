name: Test override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          token: 'test-token-placeholder'
          slug: 'owner/repo'
          override_branch: 'main'
          override_build: '42'
          override_build_url: 'https://example.com/build/42'
          override_commit: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          override_pr: '123'
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran with override inputs"
          else
            echo "FAIL: unexpected outcome"
            exit 1
          fi
