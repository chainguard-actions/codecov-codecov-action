name: Test path and search inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory and coverage directory
        run: |
          mkdir -p /tmp/cc-workdir/coverage
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          directory: '/tmp/cc-workdir/coverage'
          exclude: 'vendor,node_modules'
          root_dir: '/tmp/cc-workdir'
          network_filter: 'src/'
          network_prefix: 'project/'
          working-directory: '/tmp/cc-workdir'
      - name: Assert action ran with path inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with path inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real token/repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
