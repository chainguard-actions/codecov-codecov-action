name: Test path and report inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory and codecov yml
        run: |
          mkdir -p /tmp/test-workdir
          cat > /tmp/codecov.yml <<'EOF'
          codecov:
            require_ci_to_pass: false
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
          codecov_yml_path: '/tmp/codecov.yml'
          report_code: 'test-report-code'
          report_type: 'coverage'
          root_dir: '/tmp/test-workdir'
          working-directory: '/tmp/test-workdir'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with path inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in dry-run/no-reports scenario)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
