name: Test path and network inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory and codecov yml
        run: |
          mkdir -p /tmp/cc-workdir
          cat > /tmp/cc-workdir/codecov.yml <<'EOF'
          coverage:
            status:
              project:
                default:
                  target: auto
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
          codecov_yml_path: '/tmp/cc-workdir/codecov.yml'
          exclude: 'vendor,node_modules'
          root_dir: '.'
          network_filter: 'src/'
          network_prefix: 'prefix/'
          env_vars: 'OS,PYTHON'
          working-directory: '.'
      - name: Assert action ran (path and network inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with path/network inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real token/repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
