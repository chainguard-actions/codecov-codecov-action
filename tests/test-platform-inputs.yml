name: Test platform and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal codecov.yml for testing
        run: |
          mkdir -p /tmp/cc-config
          cat > /tmp/cc-config/codecov.yml << 'EOF'
          coverage:
            status:
              project:
                default:
                  target: auto
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          os: 'linux'
          swift_project: 'MySwiftProject'
          codecov_yml_path: '/tmp/cc-config/codecov.yml'
      - name: Assert action ran with platform inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with platform inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real token/repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
