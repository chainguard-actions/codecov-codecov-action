name: Test plugin and enterprise options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          plugin: gcov
          plugins: gcov,pycoverage
          root_dir: .
          slug: myorg/myrepo
          url: https://codecov.io
          use_legacy_upload_endpoint: false
          dry_run: true
          handle_no_reports_found: true
      - name: Assert action completed
        run: |
          echo "Action completed successfully with plugin, plugins, root_dir, slug, url, use_legacy_upload_endpoint inputs"
          echo "PASS"
