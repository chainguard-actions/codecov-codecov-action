name: Test plugin, root_dir, and OIDC inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          plugin: gcov
          plugins: gcov,pycoverage
          root_dir: /tmp
          use_oidc: false
          dry_run: true
          handle_no_reports_found: true
      - name: Assert action completed
        run: |
          echo "Action completed successfully with plugin, plugins, root_dir, and use_oidc inputs"
          echo "PASS"
