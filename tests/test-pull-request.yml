name: Test pull request event scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/42/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create coverage file
        run: |
          mkdir -p coverage
          cat > coverage/coverage.xml << 'EOF'
          <?xml version="1.0" ?>
          <coverage version="7.0" timestamp="1700000000" lines-valid="20" lines-covered="18" line-rate="0.9" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages>
              <package name="." line-rate="0.9" branch-rate="0" complexity="0">
                <classes>
                  <class name="service.py" filename="service.py" line-rate="0.9" branch-rate="0" complexity="0">
                    <lines>
                      <line number="1" hits="1"/>
                      <line number="2" hits="1"/>
                    </lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          EOF
      - id: action
        uses: .
        with:
          dry_run: "true"
          file: coverage/coverage.xml
          override_branch: feature-branch
          override_pr: "42"
          flags: pr-test
          fail_ci_if_error: "false"
          verbose: "true"
        continue-on-error: true
      - name: Assert action ran for pull request scenario
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action outcome is empty"
            exit 1
          fi
          echo "PASS: action ran for PR scenario, outcome=${{ steps.action.outcome }}"
