name: Test pypi installation method
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        run: |
          python3 --version
          pip3 --version || pip --version

      - id: action
        uses: .
        with:
          dry_run: 'true'
          use_pypi: 'true'
          handle_no_reports_found: 'true'
          disable_search: 'true'

      - name: Assert action completed with pypi install
        run: |
          echo "Action completed using pypi installation"
          echo "PASS: pypi install path works"
