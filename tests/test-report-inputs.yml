name: Test report inputs (report_code, report_type, job_code, codecov_yml_path, commit_parent, base_sha)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake coverage file and codecov yml
        run: |
          mkdir -p /tmp/report-cov
          cat > /tmp/report-cov/coverage.xml << 'EOF'
          <?xml version="1.0" ?>
          <coverage version="5.5" timestamp="1234567890" lines-valid="10" lines-covered="8" line-rate="0.8" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages>
              <package name="." line-rate="0.8" branch-rate="0" complexity="0">
                <classes>
                  <class name="example.py" filename="example.py" line-rate="0.8" branch-rate="0" complexity="0">
                    <lines>
                      <line number="1" hits="1"/>
                    </lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          EOF
          mkdir -p /tmp/report-cov/config
          cat > /tmp/report-cov/config/codecov.yml << 'EOF'
          coverage:
            status:
              project:
                default:
                  target: auto
          EOF
          echo "Created fake coverage file and codecov.yml"

      - id: action
        uses: .
        with:
          dry_run: 'true'
          files: '/tmp/report-cov/coverage.xml'
          skip_validation: 'true'
          disable_telem: 'true'
          fail_ci_if_error: 'false'
          verbose: 'true'
          report_code: 'default'
          report_type: 'coverage'
          job_code: 'test-job-001'
          codecov_yml_path: '/tmp/report-cov/config/codecov.yml'
          commit_parent: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          base_sha: 'cccccccccccccccccccccccccccccccccccccccc'

      - name: Assert action completed with report inputs
        run: |
          echo "Action completed successfully with report inputs"
          echo "PASS"
