name: Test search and upload options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create coverage directory
        run: mkdir -p /tmp/coverage-dir
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          directory: '/tmp/coverage-dir'
          exclude: '/tmp/excluded'
          env_vars: 'OS,PYTHON'
          plugins: 'noop'
          report_code: 'default'
          report_type: 'coverage'
          root_dir: '/tmp'
          network_filter: '/tmp'
          network_prefix: 'prefix/'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with search/upload options"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
