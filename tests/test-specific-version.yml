name: Test specific Codecov CLI version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create coverage file
        run: |
          mkdir -p coverage
          cat > coverage/coverage.xml << 'EOF'
          <?xml version="1.0" ?>
          <coverage version="7.0" timestamp="1700000000" lines-valid="5" lines-covered="4" line-rate="0.8" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages>
              <package name="." line-rate="0.8" branch-rate="0" complexity="0">
                <classes>
                  <class name="app.py" filename="app.py" line-rate="0.8" branch-rate="0" complexity="0">
                    <lines>
                      <line number="1" hits="1"/>
                      <line number="2" hits="0"/>
                    </lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          EOF
      - id: action
        uses: .
        with:
          dry_run: "true"
          version: "v0.7.1"
          file: coverage/coverage.xml
          fail_ci_if_error: "false"
          verbose: "true"
        continue-on-error: true
      - name: Assert action ran with specified version
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action outcome is empty"
            exit 1
          fi
          echo "PASS: action ran with specified version, outcome=${{ steps.action.outcome }}"
