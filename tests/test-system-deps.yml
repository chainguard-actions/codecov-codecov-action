name: Test system dependency check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify required system dependencies are present
        run: |
          echo "Checking for required dependencies..."
          for cmd in bash git curl gpg; do
            if command -v "$cmd" > /dev/null 2>&1; then
              echo "PASS: $cmd is available at $(command -v $cmd)"
            else
              echo "FAIL: $cmd is NOT available"
              exit 1
            fi
          done
          echo "All required system dependencies are present"
      - id: action
        uses: .
        with:
          dry_run: 'true'
          skip_validation: 'true'
          handle_no_reports_found: 'true'
          disable_telem: 'true'
          fail_ci_if_error: 'false'
          verbose: 'true'
        continue-on-error: true
      - name: Assert action ran (system deps check passed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully - system deps check passed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully after system deps check (expected without valid token/repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
