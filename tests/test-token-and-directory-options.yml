name: Test token and directory options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake coverage file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          cat > "$GITHUB_WORKSPACE/coverage/coverage.xml" <<'EOF'
          <?xml version="1.0" ?>
          <coverage version="5.5" timestamp="1234567890" lines-valid="10" lines-covered="8" line-rate="0.8" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
          </coverage>
          EOF
      - name: Create a fake codecov.yml
        run: |
          cat > "$GITHUB_WORKSPACE/codecov.yml" <<'EOF'
          coverage:
            status:
              project:
                default:
                  target: 80%
          EOF
      - id: action
        uses: .
        with:
          token: fake-codecov-token-for-dry-run
          codecov_yml_path: codecov.yml
          directory: coverage
          disable_file_fixes: true
          disable_safe_directory: true
          dry_run: true
          handle_no_reports_found: true
      - name: Assert action completed
        run: |
          echo "Action completed successfully with token, codecov_yml_path, directory, disable_file_fixes, disable_safe_directory inputs"
          echo "PASS"
