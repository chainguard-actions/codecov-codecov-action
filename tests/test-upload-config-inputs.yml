name: Test upload config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
          env_vars: 'OS,PYTHON'
          exclude: '/tmp/excluded'
          plugins: 'noop'
          gcov_args: '--branch-probabilities'
          gcov_ignore: '/tmp/ignored'
          gcov_include: '/tmp/included'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with upload config inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in dry-run/no-reports scenario)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
