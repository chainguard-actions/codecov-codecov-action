name: Test upload inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory and coverage file
        run: |
          mkdir -p /tmp/cc-workdir
          echo '{"coverage": 100}' > /tmp/cc-workdir/coverage.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: 'fake-codecov-token'
          directory: /tmp/cc-workdir
          files: /tmp/cc-workdir/coverage.json
          flags: unit,integration
          name: test-upload
          env_vars: OS,PYTHON
          exclude: vendor,node_modules
          override_branch: main
          override_build: '42'
          override_build_url: 'https://example.com/build/42'
          override_commit: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          override_pr: '123'
          slug: myorg/myrepo
          url: 'https://codecov.io'
          working-directory: /tmp/cc-workdir
          dry_run: 'true'
          handle_no_reports_found: 'true'
      - name: Assert action ran (dry run with fake token may fail gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
