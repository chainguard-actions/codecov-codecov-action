name: Test upload options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create coverage directory and file
        run: |
          mkdir -p /tmp/coverage
          cat > /tmp/coverage/coverage.xml << 'EOF'
          <?xml version="1.0" ?>
          <coverage version="5.5" timestamp="1234567890" lines-valid="10" lines-covered="8" line-rate="0.8" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages/>
          </coverage>
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          handle_no_reports_found: 'true'
          directory: '/tmp/coverage'
          exclude: '/tmp/exclude'
          files: '/tmp/coverage/coverage.xml'
          env_vars: 'OS,PYTHON'
          plugins: 'noop'
          report_code: 'default'
          report_type: 'coverage'
          root_dir: '/tmp'
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran with upload option inputs"
          else
            echo "FAIL: unexpected outcome"
            exit 1
          fi
