name: Test upload options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/cc-workdir
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: "test-token-placeholder"
          dry_run: "true"
          handle_no_reports_found: "true"
          disable_search: "true"
          env_vars: "OS,PYTHON"
          name: "test-upload"
          override_branch: "main"
          override_build: "42"
          override_build_url: "https://example.com/build/42"
          override_commit: "0000000000000000000000000000000000000000"
          override_pr: "123"
          slug: "owner/repo"
          working-directory: "/tmp/cc-workdir"
      - name: Assert action ran (dry_run with no reports)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with upload options inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
