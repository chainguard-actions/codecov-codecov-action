name: Test upload options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create coverage directory and file
        run: |
          mkdir -p /tmp/coverage
          echo '<?xml version="1.0" ?><coverage></coverage>' > /tmp/coverage/coverage.xml
      - id: action
        uses: .
        with:
          directory: '/tmp/coverage'
          exclude: '/tmp/exclude'
          files: '/tmp/coverage/coverage.xml'
          env_vars: 'OS,PYTHON'
          plugins: 'noop'
          report_code: 'myreport'
          report_type: 'coverage'
          root_dir: '/tmp'
          network_filter: '/tmp'
          network_prefix: 'prefix/'
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with upload option inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
