name: Test verbose logging and flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy coverage file
        run: |
          mkdir -p coverage
          cat > coverage/coverage.xml << 'EOF'
          <?xml version="1.0" ?>
          <coverage version="5.5" timestamp="1234567890" lines-valid="5" lines-covered="4" line-rate="0.8" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages>
              <package name="." line-rate="0.8" branch-rate="0" complexity="0">
                <classes>
                  <class name="app.py" filename="app.py" line-rate="0.8" branch-rate="0" complexity="0">
                    <lines>
                      <line number="1" hits="1"/>
                    </lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          EOF

      - id: action
        uses: .
        with:
          dry_run: 'true'
          skip_validation: 'true'
          handle_no_reports_found: 'true'
          verbose: 'true'
          files: coverage/coverage.xml
          flags: unit,integration
          name: verbose-test-upload
          disable_telem: 'true'

      - name: Assert action completed with verbose mode
        run: |
          echo "Action completed with verbose=true, flags=unit,integration, name=verbose-test-upload"
          echo "PASS: verbose mode and multiple flags work correctly"
