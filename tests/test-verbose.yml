name: Test verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify system dependencies are available
        run: |
          for cmd in bash git curl gpg; do
            if ! command -v "$cmd" > /dev/null 2>&1; then
              echo "FAIL: required command '$cmd' not found"
              exit 1
            fi
          done
          echo "PASS: all required system dependencies are available"
      - id: action
        uses: .
        with:
          verbose: 'true'
          dry_run: 'true'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
          disable_telem: 'true'
        continue-on-error: true
      - name: Assert verbose action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: verbose action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without Codecov token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
