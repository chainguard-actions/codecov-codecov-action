name: Test with explicit coverage file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake coverage file
        run: |
          mkdir -p /tmp/coverage
          cat > /tmp/coverage/coverage.xml << 'EOF'
          <?xml version="1.0" ?>
          <coverage version="7.0" timestamp="1700000000" lines-valid="10" lines-covered="8" line-rate="0.8" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages>
              <package name="." line-rate="0.8" branch-rate="0" complexity="0">
                <classes>
                  <class name="example.py" filename="example.py" line-rate="0.8" branch-rate="0" complexity="0">
                    <lines>
                      <line number="1" hits="1"/>
                      <line number="2" hits="1"/>
                    </lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          EOF
          echo "Coverage file created at /tmp/coverage/coverage.xml"
      - id: action
        uses: .
        with:
          files: '/tmp/coverage/coverage.xml'
          dry_run: 'true'
          skip_validation: 'true'
          disable_telem: 'true'
          flags: 'unittests'
          name: 'test-upload'
        continue-on-error: true
      - name: Assert action ran with coverage file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with explicit coverage file in dry_run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without Codecov token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
