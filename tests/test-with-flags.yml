name: Test with flags and name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake coverage file
        run: |
          mkdir -p /tmp/flagged-cov
          cat > /tmp/flagged-cov/coverage.xml << 'EOF'
          <?xml version="1.0" ?>
          <coverage version="5.5" timestamp="1234567890" lines-valid="10" lines-covered="9" line-rate="0.9" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages>
              <package name="." line-rate="0.9" branch-rate="0" complexity="0">
                <classes>
                  <class name="app.py" filename="app.py" line-rate="0.9" branch-rate="0" complexity="0">
                    <lines>
                      <line number="1" hits="1"/>
                    </lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          EOF
          echo "Created coverage file"

      - id: action
        uses: .
        with:
          dry_run: 'true'
          files: '/tmp/flagged-cov/coverage.xml'
          flags: 'unit,integration'
          name: 'test-upload'
          skip_validation: 'true'
          disable_telem: 'true'
          fail_ci_if_error: 'false'
          verbose: 'true'

      - name: Assert action completed with flags and name
        run: |
          echo "Action completed successfully with flags and name inputs"
          echo "PASS"
